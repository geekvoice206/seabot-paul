on:
    workflow_dispatch:
    push:
        branches:
            - dev
        paths:
            - 'src/**'
            - 'package*.json'
            - 'tsconfig.json'
            - 'webpack.config.js'
            - 'Dockerfile'
            - '.github/workflows/container_build.yml'

name: Publish Seabot Image
permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@main

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  build-args: environment=production
                  tags: |
                      ghcr.io/geekvoice408/seabot:latest
                      ghcr.io/geekvoice408/seabot:${{ github.sha }}
